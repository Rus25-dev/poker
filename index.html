<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b2a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Покер">
<title>Покер с друзьями</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body data-felt="green" data-back="red">
<div id="app">

  <!-- ===== Лобби ===== -->
  <section id="lobby" class="screen">
    <div class="lang-switch" id="langSwitch">
      <button data-lang="ru">RU</button><button data-lang="kk">KZ</button><button data-lang="en">EN</button>
    </div>
    <div class="lobby-inner">
    <div class="lobby-hero">
      <div class="logo">
        <div class="logo-suits"><span>♠</span><span class="r">♥</span><span>♣</span><span class="r">♦</span></div>
        <h1 data-i18n="title">Покер с друзьями</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="hero-fan desk-only" aria-hidden="true">
        <div class="card s0"><span class="r">10</span><span class="s">♠</span></div>
        <div class="card s0"><span class="r">J</span><span class="s">♠</span></div>
        <div class="card s0"><span class="r">Q</span><span class="s">♠</span></div>
        <div class="card s0"><span class="r">K</span><span class="s">♠</span></div>
        <div class="card s0"><span class="r">A</span><span class="s">♠</span></div>
      </div>
      <ul class="features desk-only">
        <li data-i18n="feat_1"></li><li data-i18n="feat_2"></li><li data-i18n="feat_3"></li><li data-i18n="feat_4"></li>
      </ul>
    </div>
    <div class="lobby-panel">

    <div id="restoreBox" class="card-box hidden">
      <div><span data-i18n="restore_found"></span> <b id="restoreCode"></b></div>
      <div class="row">
        <button class="btn gold" id="btnRestore" data-i18n="restore"></button>
        <button class="btn ghost" id="btnDropRestore" data-i18n="forget"></button>
      </div>
    </div>

    <div class="card-box">
      <label class="lbl" for="inName" data-i18n="your_name"></label>
      <div class="row name-row">
        <button class="ava-pick" id="btnAvatarLobby" aria-label="avatar"></button>
        <input id="inName" maxlength="16" data-i18n-ph="name_ph" autocomplete="nickname">
      </div>
    </div>

    <div class="card-box">
      <button class="btn gold big" id="btnCreate" data-i18n="create_table"></button>
      <div class="or" data-i18n="or_join"></div>
      <div class="row">
        <input id="inCode" maxlength="5" data-i18n-ph="code_ph" autocapitalize="characters" class="code-in">
        <button class="btn green" id="btnJoin" data-i18n="join"></button>
      </div>
    </div>

    <div class="row wrap">
      <button class="btn ghost" id="btnTrain" data-i18n="train"></button>
      <button class="btn ghost" id="btnStatsLobby" data-i18n="rating"></button>
      <button class="btn ghost" id="btnHistLobby" data-i18n="history_btn"></button>
      <button class="btn ghost" id="btnRulesLobby" data-i18n="combos"></button>
      <button class="btn ghost" id="btnSettingsLobby" data-i18n="settings_btn"></button>
    </div>

    <p id="installHint" class="hint hidden" data-i18n="install_hint"></p>
    <button class="btn ghost hidden" id="btnInstall" data-i18n="install"></button>
    </div>
    </div>
  </section>

  <!-- ===== Игра ===== -->
  <section id="game" class="screen hidden">
    <header class="topbar">
      <button class="chip-btn" id="btnCode"><span class="dot" id="netDot"></span><span id="roomCode">—</span></button>
      <div class="blinds" id="blindsInfo">—</div>
      <div class="top-tools desk-only">
        <button class="icon-btn" id="btnHistTop" data-i18n-title="tt_history">📜</button>
        <button class="icon-btn" id="btnStatsTop" data-i18n-title="tt_stats">📊</button>
        <button class="icon-btn" id="btnSoundTop" data-i18n-title="tt_sound">🔊</button>
        <button class="icon-btn" id="btnSettingsTop" data-i18n-title="tt_settings">⚙️</button>
      </div>
      <button class="icon-btn" id="btnFair" data-i18n-title="tt_fair">🔒</button>
      <button class="icon-btn" id="btnMenu" aria-label="menu">☰</button>
    </header>

    <div class="game-main">
      <div id="tableWrap">
        <div id="stage">
          <div id="felt">
            <div class="felt-inner">
              <div id="centerMsg"></div>
              <div id="board"></div>
              <div id="potInfo"></div>
            </div>
          </div>
          <div id="seats"></div>
          <div id="floaters"></div>
        </div>
      </div>

      <!-- нижняя панель компьютерной версии: слева вкладки, справа действия -->
      <div id="dock" class="desk-only">
        <div class="dock-left">
          <div class="dock-tabs" role="tablist">
            <button data-tab="hints" class="on" data-i18n="tab_hints"></button>
            <button data-tab="chat"><span data-i18n="tab_chat"></span><span class="badge hidden" id="dockBadge">0</span></button>
            <button data-tab="log" data-i18n="tab_log"></button>
          </div>
          <div class="dock-body" id="dockBody"></div>
        </div>
        <div class="dock-right" id="dockRight"></div>
      </div>

      <div id="hud">
        <div id="myArea">
          <div id="myCards"></div>
          <div id="hints"></div>
        </div>
        <div id="coachBox" class="hidden"></div>
        <div id="actions"></div>
      </div>
    </div>

    <nav class="bottombar">
      <button class="nav-btn" id="btnChat"><span data-i18n="chat"></span><span class="badge hidden" id="chatBadge">0</span></button>
      <div class="quick-emoji" id="quickEmoji"></div>
      <button class="nav-btn" id="btnLog">📜</button>
    </nav>
  </section>

  <!-- ===== Окна ===== -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-x" id="modalClose" aria-label="close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head"><b id="drawerTitle"></b><button class="icon-btn" id="drawerClose">✕</button></div>
    <div id="chatList" class="drawer-list"></div>
    <div id="logList" class="drawer-list hidden"></div>
    <div class="emoji-row" id="emojiRow"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatIn" maxlength="200" data-i18n-ph="msg_ph" autocomplete="off">
      <button class="btn green" type="submit">➤</button>
    </form>
  </aside>

  <div id="fx"></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
